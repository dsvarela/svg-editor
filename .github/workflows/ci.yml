# Everything the handbook and CLAUDE.md say to run before trusting a change.
#
# Two jobs rather than one, because they fail for unrelated reasons. `checks`
# needs nothing but Node. `browser` needs a browser Playwright can drive, and is
# the only part that can be broken by the runner image rather than by the code.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` typechecks first, so this covers `npm run check` too.
      # It is listed separately anyway: when both break, the shorter one names
      # the reason and the longer one only says the build failed.
      - name: Typecheck
        run: npm run check

      - name: Unit and DOM tests
        run: npm test

      - name: Style sweep and link check
        run: npm run check:docs

      # Reads the stylesheet, so it needs no browser and belongs in this job.
      # It was never run by CI either: the palette could drop below its contrast
      # floors and nothing would say so until somebody re-ran it by hand.
      - name: Contrast floors
        run: npm run check:contrast

      - name: Build the single file
        run: npm run build

      # The whole application is one file. If that stops being true the build
      # has picked up a separate asset, and every claim about opening it from
      # `file://` is void. Cheaper to assert than to discover later.
      - name: Assert the build is still one file
        run: |
          count=$(find dist -type f | wc -l)
          find dist -type f
          test "$count" -eq 1 || { echo "dist holds $count files, expected 1"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: svg-editor
          path: dist/index.html

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # playwright-core ships no browser, and it drives its own builds rather
      # than whatever the runner image carries: a stock Firefox has no Juggler
      # protocol compiled in, so `executablePath` pointed at one cannot launch.
      # This puts the build `tools/browser.mjs` reaches by default under
      # `~/.cache/ms-playwright`.
      #
      # It replaces a step that hunted for Edge and exported `BROWSER_PATH`.
      # That variable is only read when the engine is Chromium, so from the
      # switch to Firefox on 2026-08-18 the job found Edge, set the path, then
      # tried to launch a Firefox nobody had installed. Every scenario died at
      # launch and this job was red on every commit in between.
      #
      # Cached on the lockfile, because the download is the slow part and the
      # browser version is pinned by the playwright-core in it. The install runs
      # on a hit as well: it skips a browser already present, and a partially
      # restored cache that skipped it would leave the job with no browser.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Firefox
        run: node node_modules/playwright-core/cli.js install --with-deps firefox

      # Server and scenarios in one step on purpose. A `&` in an earlier step
      # leaves the process orphaned across the step boundary, which is how this
      # kind of job ends up failing to connect for reasons unrelated to the
      # code. Starting and stopping it here keeps its lifetime visible.
      #
      # The scenarios run against the dev server, which is what `npm run drive`
      # does locally. Running them against `dist` instead would test a
      # different artefact than the one anybody has debugged.
      - name: Drive every scenario
        run: |
          npm run dev -- --port 5173 --strictPort &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT

          for _ in $(seq 60); do
            curl -sf -o /dev/null http://localhost:5173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:5173/ || { echo "dev server never came up"; exit 1; }

          # Before running any of them: a scenario that never calls `check`
          # reads the page, returns what it found and exits 0 whatever the
          # editor did. Cheap to answer and pointless to discover afterwards.
          node tools/drive.mjs --audit

          # Taken from drive.mjs itself, so adding a scenario there is enough.
          # The loop keeps going after a failure so one run reports every
          # broken scenario instead of only the first.
          #
          # The floor is here because a loop over an empty list runs nothing and
          # succeeds: a `--list` that printed a stack trace, or a rename that
          # left the export empty, would have turned the whole browser job into
          # a green step that measured nothing. The number is a floor and not an
          # equality, so adding a scenario needs no edit here.
          names=$(node tools/drive.mjs --list)
          count=$(echo "$names" | grep -c .)
          if [ "$count" -lt 50 ]; then
            echo "drive.mjs listed $count scenarios, which is fewer than this repo has"
            exit 1
          fi
          echo "running $count scenarios"

          failed=""
          for s in $names; do
            echo "::group::$s"
            node tools/drive.mjs "$s" || failed="$failed $s"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed"
            exit 1
          fi

          # The three surveys of the whole interface. They printed a count and
          # exited 0 whatever it said, and nothing here ran them, so no
          # regression in keyboard reach or touch target size could turn a run
          # red -- they were figures a person read at review time and quoted
          # afterwards as gates. Both set an exit code now.
          echo "::group::keyboard reach"
          node tools/keys.mjs
          echo "::endgroup::"
          echo "::group::touch targets"
          node tools/touch.mjs --coarse
          echo "::endgroup::"
